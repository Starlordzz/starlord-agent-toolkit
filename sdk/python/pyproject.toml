[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-client"
version = "0.1.0"
description = "Lightweight On-Demand Python Client for Multi-UIAutomator2 Automation Server"
authors = [{ name = "Developer" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-uiautomator2"
version = "0.1.0"
description = "On-demand cross-language Android UI automation & AI debug server (FastAPI service + Python/Dart SDKs + MCP server)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "uiautomator2>=3.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "openai>=1.14.0",
    "python-multipart>=0.0.9",
    "mcp>=1.9.0,<2.0",
]

[project.scripts]
mcp-server-android = "mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["server", "server.core", "server.routes", "server.ai", "mcp_server"]
